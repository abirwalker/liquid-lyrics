name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Check tag belongs to master
        run: |
          git merge-base --is-ancestor HEAD origin/master || {
            echo 'Release tags must point to a commit already on master.' >&2
            exit 1
          }
      - name: Check version and prepare release notes
        run: node scripts/prepare-release.mjs "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-notes.md"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc -p tests/tsconfig.json --noEmit
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "Extension/Build/$GITHUB_REF_NAME/liquid-lyrics.js" \
            --verify-tag \
            --title "Liquid Lyrics $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
